name: Build APK

on:
  push:
    branches: ['arena/**', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: |
          npm ci
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bump version code for this build
        run: |
          cd android
          VC=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode ${VC}/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          SRC=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "built: $SRC"
          cp "$SRC" "dist/DoodhHisaab-${{ github.run_number }}.apk"
          cp "$SRC" "dist/DoodhHisaab-latest.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoodhHisaab-apk
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      # Refresh the "latest" download link on every successful build of main
      - name: Publish APK to release (latest)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Doodh Hisaab — latest build
          body: |
            Download **DoodhHisaab-latest.apk** below and install it on your Android phone.

            If Play Protect asks, choose **Install anyway** — this APK is built from the
            source in this repository by GitHub Actions.
          files: dist/*.apk
          make_latest: true

      - name: Publish APK to release (branch preview)
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Doodh Hisaab build #${{ github.run_number }} (preview)
          body: |
            Preview build from branch `${{ github.ref_name }}`.
          files: dist/*.apk
          make_latest: false
